services:
  inventory-mock:
    build: ./inventory-mock
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      # 每请求 sleep ~2.5s，拖住 order-query 的 Tomcat 线程
      DELAY_MS: "2500"

  order-query:
    build: ./order-query
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      INVENTORY_BASE_URL: http://inventory-mock:8081
    depends_on:
      - inventory-mock
